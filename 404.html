<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 存在しない URL ならどの階層でもこのページが表示されるので、相対パスをサイトのルート基準にする。
       サイトを /リポジトリ名/ のようなサブパスで公開する場合は、href をそのパスに変える -->
  <base href="/">
  <title>GAME OVER（404） | Hikaruのポートフォリオ</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">

  <link rel="stylesheet" href="css/main.css">
  <script type="module" src="js/pages/not-found.js"></script>
</head>

<body class="theme-dark">
  <tt-header></tt-header>

  <main class="section section--fill">
    <div class="container text-center flow flow--md">
      <div class="bounce-ball" aria-hidden="true"></div>
      <h1 class="display-title display-title--xl">Game Over</h1>
      <p class="tag tag--primary">404 Not Found</p>
      <p>お探しのページは見つかりませんでした。<br>URL が間違っているか、ページが移動・削除された可能性があります。</p>
      <div class="flow flow--sm">
        <p class="display-title blink">Continue?</p>
        <ul class="choice-list">
          <li><a href="./">Yes<span class="choice-list__note">メニューへ</span></a></li>
          <li><a href="./" data-back>No<span class="choice-list__note">前のページへ</span></a></li>
        </ul>
      </div>
    </div>
  </main>
</body>

</html>
