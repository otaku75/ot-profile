<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>プロフィール | Hikaruのポートフォリオ</title>
  <meta name="description" content="太田輝のプロフィール。能力値、使用用具、卓球歴を紹介しています。">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">

  <link rel="stylesheet" href="css/main.css">
  <script type="module" src="js/pages/profile.js"></script>
</head>

<body>
  <tt-header></tt-header>

  <main>
    <section class="section section--page-top" id="status">
      <div class="container">
        <tt-page-header en="Profile" ja="プロフィール"></tt-page-header>
        <div class="split split--media">
          <img class="photo" src="assets/images/profile.jpg" alt="ユニフォーム姿で立つ太田輝" width="1365" height="2048">
          <div class="flow flow--lg">
            <div class="panel flow flow--md">
              <div class="flow flow--sm">
                <p class="tag tag--primary">一般プレーヤー</p>
                <h2 class="display-title">HIKARU OTA</h2>
                <p class="caption">太田 輝</p>
              </div>
              <div class="flow flow--sm">
                <h3 class="eyebrow">Status</h3>
                <tt-fact-list id="profile-facts"></tt-fact-list>
              </div>
            </div>
            <div class="flow">
              <p>ここに自己紹介文が入ります。卓球を始めたきっかけ、これまでの競技歴、プレースタイルの特徴などを紹介します。</p>
              <p>得意なプレーや試合で大切にしていること、練習で取り組んでいることなど、トップページより一歩踏み込んだ内容を書くと読み応えが出ます。</p>
              <p>今後の目標や、応援してくれる方へのメッセージで締めくくると、人柄が伝わるプロフィールになります。</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="section section--muted" id="ability">
      <div class="container flow flow--md">
        <tt-section-heading en="Ability" ja="能力値"></tt-section-heading>
        <div class="panel">
          <tt-stat-list id="ability-stats" max="10"></tt-stat-list>
        </div>
        <p class="caption">※ 10段階の自己評価です</p>
      </div>
    </section>

    <section class="section" id="equipment">
      <div class="container">
        <tt-section-heading en="Equipment" ja="そうび"></tt-section-heading>
        <tt-equipment-list id="equipment-list"></tt-equipment-list>
      </div>
    </section>

    <section class="section section--muted" id="history">
      <div class="container">
        <tt-section-heading en="History" ja="卓球歴"></tt-section-heading>
        <div class="panel">
          <tt-timeline id="history-timeline" order="asc"></tt-timeline>
        </div>
      </div>
    </section>
  </main>

  <tt-footer></tt-footer>
</body>

</html>
