# つくったもの・IT のご相談（Works ページ）。どちらも上から順に表示
# 片方が空なら、その節は表示されない。両方とも空なら、Works ページは「準備中」の表示になる

# つくったもの
#   title       … 名前
#   description … 紹介文（なくてもよい）
#   date        … つくった時期。2026-11 / 2026 など（なくてもよい）
#   tags        … 種類や使った技術。[Webサイト, Astro] のように書く（なくてもよい）
#   url         … 見られるページの URL（なくてもよい。あると「見てみる」ボタンが付く）
#   image       … スクリーンショットなど（なくてもよい）。ファイルは content/images/ に置く
#                 例: image: { src: ./images/works-site.png, alt: トップページの画面 }
works:
  - title: このWebサイト
    description: 卓球のプロフィールと、つくったものを紹介するポートフォリオサイトです。ゲームのメニュー画面のようなデザインにしました。内容はファイルで管理していて、GitHub に push すると公開されます。
    date: 2026
    tags: [Webサイト, Astro, Cloudflare]

# ご相談いただけること（卓球に関わる IT・DX）。下に、お問い合わせページへのボタンが付く
#   title       … 相談の内容
#   description … 説明（なくてもよい）
services:
  - title: クラブ・チームのWebサイト
    description: クラブの紹介や練習日程、メンバー募集のページをつくります。更新しやすい形にして、お渡しします。
  - title: 大会・練習会のデジタル化
    description: 申し込みの受け付けや連絡、組み合わせ・結果の共有など、紙や手作業で行っている作業をオンラインにします。
  - title: IT まわりのちょっとした相談
    description: どのサービスを使えばいいか、今のやり方をどう改善できるかなど、小さなことでもお気軽にどうぞ。
