# サイト全体の設定
#
#   title         … サイト名（ブラウザのタブ、検索結果、SNS でシェアしたときに出る）
#   description   … サイトの説明文（検索結果やシェアしたときに出る）
#   contact_email … お問い合わせページの「メールで問い合わせる」ボタンの宛先
#                   空にすると「お問い合わせ先を準備中です」と表示される
#   social        … フッターに出す SNS。アカウント名（@ はあってもなくてもよい）か URL を書く
#                   空のものは表示されない

title: Hikaruのポートフォリオ
description: 卓球プレーヤー 太田輝のポートフォリオ。プロフィール、戦績、ギャラリーなどを掲載しています。
contact_email: info@example.com

social:
  instagram:
  x:
  youtube:
