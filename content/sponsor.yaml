# スポンサー（スポンサーページと、トップのメニューに会社名を表示）。上から順に表示
# 全部消すと、スポンサーページは「準備中」の表示になる
#
#   title       … 会社名・団体名
#   description … 紹介文（なくてもよい）
#   url         … 公式サイトの URL（なくてもよい）
#   since       … 支援開始（例: 2025。なくてもよい）
#   logo        … ロゴ（なければ会社名を表示）。ファイルは content/images/ に置く
#                 例: logo: { src: ./images/sponsor-logo.png }

- title: 株式会社〇〇
  description: ここに会社の紹介文が入ります。どんな事業をしている会社か、どのように活動を支えていただいているかなどを書きます。
  since: 2025
